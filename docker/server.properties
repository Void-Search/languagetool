# Client requests have a shorter deadline; these bounds also constrain work after
# a caller disconnects. The cold-start health check may take longer than a check.
maxCheckThreads=4
maxTextCheckerThreads=4
maxWorkQueueSize=16
textCheckerQueueSize=16
maxTextLength=50000
maxCheckTimeMillis=10000
cacheSize=1000
pipelineCaching=true
